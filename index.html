<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<meta name="theme-color" content="#080e20">
<meta name="description" content="Orbit — 夜空を巡るように、みんなの今がつながるSNS">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbit">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 夜の街のネオンのように静かで華やか。落ち着いて毎日眺められるSNS
   IDEA: 夜空を巡る軌道（Orbit）— ヘッダーは星空と街の灯り、反応は青く光る
   PICTURE: ヘッダーに描いた夜景（星・流れ星・ビル・電波塔）と、光るカードのタイムライン
   COLOUR+TYPE: 深い紺 #080e20 が主役、青のグラデーション #2f6bff→#5aa2ff がアクセント。Zen Kaku Gothic New ＋ Outfit
   LAYOUT: 左ナビ／中央フィード（カード）／右にトレンド・おすすめ・お知らせ。スマホは1列＋下部タブ＋投稿ボタン */
:root{color-scheme:dark;--bg:#080e20;--panel:#0e1834;--panel2:#13204a;--line:rgba(130,160,255,.15);--line2:rgba(130,160,255,.28);
--ink:#e9edf8;--mut:#8f9aba;--acc:#3d7bff;--acc2:#6aa8ff;--accD:#8ab8ff;--grad:linear-gradient(135deg,#2a62ff,#58a0ff);
--like:#ff5c8a;--rp:#3fd19a;--soft:rgba(61,123,255,.13);--card:#0b1430;--ov:rgba(2,6,20,.72);--glow:0 8px 26px rgba(47,107,255,.38)}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.6 "Zen Kaku Gothic New",system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","PingFang SC","PingFang TC","Microsoft YaHei","Microsoft JhengHei","Noto Sans CJK SC",sans-serif;overflow-x:clip;min-height:100vh;
background:radial-gradient(900px 600px at 0% 100%,rgba(42,98,255,.16),transparent 60%),radial-gradient(700px 500px at 100% 0%,rgba(88,160,255,.10),transparent 60%),var(--bg);background-attachment:fixed}
a{color:inherit;text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none}
.app{display:grid;grid-template-columns:270px minmax(0,640px) 350px;justify-content:center;min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;padding:22px 18px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);overflow:auto;
background:radial-gradient(420px 300px at 120% 70%,rgba(42,98,255,.22),transparent 70%),linear-gradient(180deg,rgba(10,18,44,.9),rgba(8,14,32,.9))}
.logo{display:flex;align-items:center;gap:12px;margin:2px 0 24px 8px}
.logo>svg{width:50px;height:50px;flex:none;filter:drop-shadow(0 0 10px rgba(90,160,255,.55))}
.logo .wm{font-size:28px}
.logo small{display:block;font:500 10.5px/1.4 "Outfit",sans-serif;color:#b9c4e6;letter-spacing:.08em;margin-top:6px;white-space:nowrap}
.wm{display:block;font:600 30px/1 "Outfit",sans-serif;letter-spacing:.01em;color:#fff}.wi{position:relative;display:inline-block}.wi svg{position:absolute;left:50%;top:-.02em;width:.34em;height:.34em;margin-left:-.17em;color:#6f8dff;filter:drop-shadow(0 0 6px rgba(111,141,255,.8))}
.nav{display:flex;align-items:center;gap:16px;padding:12px 18px;border-radius:999px;font-size:17px;font-weight:500;min-height:52px;position:relative;color:#cfd6ea}
.nav:hover{background:var(--soft)}
.nav[aria-current=page]{background:var(--grad);color:#fff;font-weight:700;box-shadow:var(--glow)}
.badge{position:absolute;right:16px;top:50%;margin-top:-11px;background:var(--grad);color:#fff;font:700 12px/1 "Outfit",sans-serif;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 3px var(--bg)}
.badge[hidden]{display:none}
.navsep{height:1px;background:var(--line);margin:10px 6px}
.big{margin-top:8px;background:var(--grad);color:#fff;font-weight:700;font-size:17px;min-height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--glow)}
.big:hover{filter:brightness(1.1)}
.me{margin-top:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 8px 4px;border-top:1px solid var(--line)}
.me .dots{color:var(--mut)}
main{min-height:100vh;padding-bottom:40px;border-right:1px solid var(--line)}
#top{position:sticky;z-index:5;top:0}
#top.wt{top:calc(-1 * var(--hh))}
.hero{--hh:76px;position:relative;height:var(--hh);overflow:hidden;border-bottom:1px solid var(--line)}
#top.wt{--hh:76px}
.hero svg.sky{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,14,32,.92) 0%,rgba(8,14,32,.55) 45%,rgba(8,14,32,0) 75%)}

.tt{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:100%;padding:0 26px}
.tt h1{font:700 24px/1.15 "Zen Kaku Gothic New",sans-serif;margin:0;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.5)}

.tt .sub{font-size:13px;color:#c6cfe8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);flex:none}.back:hover{background:var(--soft)}
.mav{display:none}.mlogo{display:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 18px;background:rgba(8,14,32,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabsw{position:relative}.tabsw .tabs{scroll-behavior:smooth}
.tabar{position:absolute;top:0;bottom:0;z-index:2;width:44px;display:grid;place-items:center;color:var(--ink);border:0}
.tabar[hidden]{display:none}.tabar svg{width:20px;height:20px}
.tabar{width:52px}.tabar.l{left:0;justify-content:start;padding-left:6px;background:linear-gradient(90deg,var(--bg) 60%,transparent)}.tabar.r{right:0;justify-content:end;padding-right:6px;background:linear-gradient(270deg,var(--bg) 60%,transparent)}.tabar.r svg{transform:scaleX(-1)}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;padding:0 15px;min-height:42px;border-radius:999px;font-weight:700;color:#b9c2dc;white-space:nowrap;font-size:15px}
.tab svg{width:18px;height:18px}
.tab:hover{background:var(--soft);color:#fff}.tab[aria-selected=true]{background:var(--grad);color:#fff;box-shadow:var(--glow)}
#view .tabs{position:static;background:transparent;backdrop-filter:none;padding:10px 16px}
.srch{margin:12px 16px;display:flex;align-items:center;gap:10px;background:rgba(19,32,74,.6);border:1px solid var(--line2);border-radius:999px;padding:0 18px;color:var(--mut)}
.srch input{flex:1;border:0;background:transparent;padding:13px 0;font-size:16px;outline:0;color:var(--ink)}
.srch input::placeholder{color:var(--mut)}
.srch:focus-within{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(61,123,255,.2)}
.panel,.cmp,.post,.urow,.nt,.sec,.note,.rep{background:linear-gradient(180deg,rgba(17,29,64,.72),rgba(12,22,50,.72));border:1px solid var(--line);border-radius:18px}
.cmp{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;padding:18px;margin:14px 14px 10px}
#homeC .cmp{margin-top:14px}
.ctext{width:100%;border:1px solid var(--line);resize:none;background:rgba(8,14,32,.55);border-radius:16px;font-size:17px;line-height:1.55;padding:16px 18px;min-height:76px;outline:0;color:var(--ink)}
.ctext:focus{border-color:var(--acc2)}
.ctext::placeholder{color:var(--mut)}
.copts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.cbar{display:flex;align-items:center;gap:2px;padding-top:10px;margin-top:10px;border-top:1px solid var(--line);position:relative}
.tool{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--acc2)}.tool:hover{background:var(--soft)}
.tool .gif{font:800 11px/1 "Outfit",sans-serif;border:2px solid currentColor;border-radius:5px;padding:3px 3px}
.csel{appearance:none;border:1px solid var(--line2);background:rgba(8,14,32,.6) url("data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24' fill='none' stroke='%238f9aba' stroke-width='2.4'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E") no-repeat right 10px center/14px;border-radius:999px;padding:0 30px 0 14px;font-size:13px;color:#cfd6ea;font-weight:700;min-height:38px;max-width:190px}
.sp{flex:1}.ring{width:28px;height:28px}.cnt{font:500 13px/1 "Outfit",sans-serif;color:var(--mut);min-width:2.2em;text-align:right}.cnt.over{color:var(--like);font-weight:700}
.send{white-space:nowrap;background:var(--grad);color:#fff;font-weight:700;padding:0 24px;min-height:46px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--glow);margin-left:6px}
.send:disabled{opacity:.4;cursor:default;box-shadow:none}.send:not(:disabled):hover{filter:brightness(1.1)}
.emo{position:absolute;bottom:52px;left:0;z-index:20;background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(8,36px);gap:2px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.emo button{width:36px;height:36px;border-radius:8px;font-size:20px}.emo button:hover{background:var(--soft)}
.btn{border:1px solid var(--line2);border-radius:999px;padding:0 16px;min-height:40px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;background:rgba(8,14,32,.4);color:var(--ink)}
.btn:hover{background:var(--soft);border-color:var(--acc2)}.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}.btn.dan{color:var(--like)}.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.prev{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 0}.prev:empty{display:none}
.pv{position:relative;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.pv img,.pv video{display:block;width:100%;height:150px;object-fit:cover}
.pv .x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:18px}
.pv .alt{width:100%;border:0;border-top:1px solid var(--line);background:rgba(8,14,32,.8);font-size:13px;padding:8px 10px;color:var(--ink)}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;flex:none;user-select:none;overflow:hidden;box-shadow:0 0 0 2px rgba(130,160,255,.25)}
.cmp>.av{width:56px;height:56px}
.av img{width:100%;height:100%;object-fit:cover}
.av.s{width:40px;height:40px;font-size:16px}.av.xs{width:22px;height:22px;font-size:11px;display:inline-grid;vertical-align:middle;box-shadow:none}.av.xl{width:124px;height:124px;font-size:46px;box-shadow:0 0 0 5px var(--bg),0 0 24px rgba(90,160,255,.5)}
.post{padding:16px 18px 8px;margin:0 14px 10px;cursor:pointer;animation:in .6s ease-out;transition:border-color .2s,background .2s}
.post:hover{border-color:var(--line2);background:linear-gradient(180deg,rgba(21,36,80,.8),rgba(14,25,58,.8))}
@keyframes in{from{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(61,123,255,.25)}}
.post.d1{margin-left:38px}.post.d2{margin-left:62px}.post.d3{margin-left:86px}
.post.main{cursor:default;border-color:var(--line2)}.post.main .txt{font-size:20px}
.ctx{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;font-weight:700;margin:0 0 6px 36px}.ctx svg{width:16px;height:16px}.ctx.warn{color:var(--like)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px}
.head{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;position:relative;padding-right:40px}
.nm{font-weight:700;font-size:16.5px}.hd,.tm{color:var(--mut);font-size:14px;white-space:nowrap}.tm:hover{color:var(--ink)}
.act.more-btn{position:absolute;right:-10px;top:-8px}
.rto{color:var(--mut);font-size:14px}.rto a{color:var(--acc2)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 10px;font-size:16.5px;line-height:1.65}
.tag,.lnk{color:var(--acc2);font-weight:700}.tag:hover,.lnk:hover{color:#a9cbff;text-decoration:underline}
.media{display:grid;gap:4px;border-radius:16px;overflow:hidden;margin:6px 0 10px;border:1px solid var(--line)}
.media.n2,.media.n3,.media.n4{grid-template-columns:1fr 1fr}.media.n3 .mi:first-child{grid-row:span 2}
.mi{display:block;width:100%;height:100%}.mi img{display:block;width:100%;height:100%;max-height:420px;min-height:150px;object-fit:cover}
.media.n1 .mi img{max-height:520px}.media video{display:block;width:100%;max-height:520px;background:#000}
.quote{border:1px solid var(--line2);border-radius:16px;padding:10px 14px;margin:6px 0 10px;background:rgba(8,14,32,.4)}.quote:hover{background:rgba(19,32,74,.6)}
.quote .head{padding:0}.quote .txt{font-size:15px;margin:2px 0}.quote.gone{color:var(--mut);font-size:14px}
.acts{display:flex;justify-content:space-between;margin-left:-10px;margin-right:-10px}
.act{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 10px;border-radius:999px;color:var(--mut);font:500 14px/1 "Outfit","Zen Kaku Gothic New",sans-serif;position:relative}
.act svg{width:20px;height:20px}.act:hover{background:var(--soft);color:var(--acc2)}
.act.liked{color:var(--like)}.act.liked svg{fill:currentColor;animation:pop .35s;filter:drop-shadow(0 0 6px rgba(255,92,138,.6))}.act.rped{color:var(--rp)}.act.bmd{color:var(--acc2)}.act.bmd svg{fill:currentColor}
.act:disabled{opacity:.35;cursor:not-allowed}
@keyframes pop{50%{transform:scale(1.35)}}
.menu{position:absolute;right:0;top:30px;z-index:20;background:var(--panel2);border:1px solid var(--line2);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.55);min-width:240px;padding:6px;cursor:default}
.menu button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;font-weight:500;min-height:44px}
.menu button:hover{background:var(--soft)}.menu .dan{color:var(--like)}
.acts .menu{top:40px;left:0;right:auto}
.stats{display:flex;gap:18px;flex-wrap:wrap;border-block:1px solid var(--line);padding:10px 0;margin:8px 0;font-size:15px}.stats b{font-family:"Outfit",sans-serif}
.stats button:hover{color:var(--acc2)}
.urow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;margin:0 14px 10px}
.urow:hover{border-color:var(--line2)}.urow .bio{font-size:14px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.urow .acts2{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.pill{font-size:12px;background:var(--soft);color:var(--accD);border-radius:6px;padding:1px 7px;font-weight:700;white-space:nowrap}
.empty{padding:56px 24px;text-align:center;color:var(--mut)}
.empty svg{width:120px;height:120px;display:block;margin:0 auto 14px;filter:drop-shadow(0 0 14px rgba(90,160,255,.45))}
.empty b{display:block;font:700 21px/1.3 "Zen Kaku Gothic New",sans-serif;color:var(--ink);margin-bottom:6px;text-wrap:balance}
.note{margin:12px 14px;padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.note>div{flex:1 1 200px}.note .x{margin-left:auto;font-weight:700;color:var(--mut);min-width:28px;min-height:28px}
.note.warn{border-color:rgba(255,92,138,.5);background:rgba(255,92,138,.1)}
.ph{height:210px;position:relative;overflow:hidden;margin:14px 14px 0;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0}
.ph img{width:100%;height:100%;object-fit:cover}.ph svg{position:absolute;inset:0;width:100%;height:100%}
.pi{padding:0 22px 18px;position:relative;margin:0 14px 10px;border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;background:linear-gradient(180deg,rgba(17,29,64,.72),rgba(12,22,50,.72))}
.pi .av{margin-top:-66px}
.pi .tools{position:absolute;right:20px;top:14px;display:flex;gap:8px}
.pi h2{font:700 25px/1.2 "Zen Kaku Gothic New",sans-serif;margin:12px 0 0}
.pi .meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:14px;margin:8px 0}
.pi .cnts{display:flex;gap:20px;font-size:15px;color:var(--mut)}.pi .cnts b{color:var(--ink);font-family:"Outfit",sans-serif;margin-right:3px}
.pi .cnts button:hover{color:var(--acc2)}
.sec{padding:18px 20px;margin:0 14px 10px}
.sec h2{font:700 18px/1.2 "Zen Kaku Gothic New",sans-serif;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.fld{display:grid;gap:6px;margin-bottom:14px}.fld label,.lbl{font-weight:700;font-size:14px}
.fld input,.fld textarea,.fld select,.inp{width:100%;border:1px solid var(--line2);background:rgba(8,14,32,.6);border-radius:12px;padding:11px 13px;font-size:16px;color:var(--ink)}
.fld input:focus,.fld textarea:focus,.inp:focus{border-color:var(--acc2);outline:0}
.hint{font-size:13px;color:var(--mut)}.err{font-size:13px;color:var(--like);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;min-height:36px;background:rgba(8,14,32,.4)}
.chip button{width:26px;height:26px;border-radius:50%;color:var(--mut)}.chip button:hover{background:var(--soft)}
.chip.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #fff}
.ck{display:flex;align-items:center;gap:10px;min-height:44px}.ck input{width:20px;height:20px;accent-color:var(--acc)}
.inline{display:flex;gap:8px}.inline .inp{flex:1}
.nt{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:14px;padding:14px 18px;margin:0 14px 10px;cursor:pointer}
.nt:hover{border-color:var(--line2)}.nt.unread{border-color:rgba(90,160,255,.55);box-shadow:inset 3px 0 0 var(--acc2)}
.nt .ic{width:28px;height:28px}.nt .ic.like{color:var(--like)}.nt .ic.repost{color:var(--rp)}.nt .ic.follow,.nt .ic.mention,.nt .ic.reply,.nt .ic.quote{color:var(--acc2)}.nt .ic.ann{color:#ffcf5a}
.nt .ex{color:var(--mut);font-size:14px;margin-top:2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.trend{display:grid;grid-template-columns:28px minmax(0,1fr) 64px;gap:10px;width:100%;padding:10px 0;text-align:left;min-height:52px;align-items:center}
.trend:hover b{color:var(--acc2)}
.trend .rk{font:500 20px/1 "Outfit",sans-serif;color:var(--mut);text-align:center}
.trend b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trend span{color:var(--mut);font-size:13px}
.trend svg{width:64px;height:28px;overflow:visible}
.up{color:var(--rp);font-weight:700;font-size:12px;margin-left:6px}
aside{padding:22px 20px;position:sticky;top:0;height:100vh;overflow:auto}
.box{background:linear-gradient(180deg,rgba(17,29,64,.72),rgba(12,22,50,.72));border:1px solid var(--line);border-radius:20px;padding:16px 20px;margin-top:18px}
.box h2{font:700 19px/1.1 "Zen Kaku Gothic New",sans-serif;margin:2px 0 10px;display:flex;align-items:center;gap:10px}

<script>
// ===== サーバー接続（Supabase） =====
(()=>{
const showErr=msg=>{let d=document.getElementById('dbg');if(!d){d=document.createElement('div');d.id='dbg';d.setAttribute('role','alert');d.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#2a0b18;color:#fff;border:1px solid #ff5c8a;border-radius:14px;padding:12px 14px;font:13px/1.6 system-ui,sans-serif;white-space:pre-wrap;max-height:45vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)';d.innerHTML='<b>問題が発生しました</b>（この内容をそのまま伝えてください）\n画面のバージョン: '+VER+'\n';document.body.appendChild(d)}d.appendChild(document.createTextNode(msg+'\n'))};
window.addEventListener('error',e=>{const m=String(e.message||'');
 // 外部のプログラム（ロボット確認など）のエラーは中身が分からず、Orbit の動作にも関係しないので表示しない
 if(!e.lineno&&(/^Script error\.?$/i.test(m)||!m)){try{KODAMA.steps&&KODAMA.steps.push('外部スクリプトのエラー（表示しない）')}catch(_){}return}
 if(e.filename&&!e.filename.startsWith(location.origin)&&!/^blob:/.test(e.filename))return;
 showErr('画面のエラー: '+m+' （'+(e.lineno||'?')+'行目）')});
window.addEventListener('unhandledrejection',e=>{const r=e.reason||{};showErr('処理のエラー: '+(r.message||r.code||String(r)))});
const VER='2026-11-25-sb1',steps=[];const trace=m=>{steps.push(new Date().toLocaleTimeString('ja-JP')+'  '+m);if(steps.length>40)steps.shift()};
const CONF=window.ORBIT_CONFIG||{};
const themeOf=()=>{let t='dark';try{t=localStorage.getItem('orbit-theme')||'dark'}catch(e){}return['auto','dark','light'].includes(t)?t:'dark'};
const mqLight=matchMedia('(prefers-color-scheme: light)');
function applyTheme(){const t=themeOf(),r=t==='auto'?(mqLight.matches?'light':'dark'):t;document.documentElement.dataset.theme=r;
 const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',r==='light'?'#f4f7ff':'#080e20')}
applyTheme();try{mqLight.addEventListener('change',applyTheme)}catch(e){}
const SB_URL=String(CONF.SUPABASE_URL||'').replace(/\/+$/,''),SB_KEY=String(CONF.SUPABASE_ANON_KEY||'');
const SB_OK=!!(window.supabase&&/^https?:\/\/\S+$/.test(SB_URL)&&SB_KEY.length>20);
const urlHash=location.hash,recovering=/type=recovery/.test(urlHash),urlErr=/error_code=|error=/.test(urlHash)?decodeURIComponent((urlHash.match(/error_description=([^&]*)/)||[])[1]||'').replace(/\+/g,' '):'';
const sb=SB_OK?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'orbit-auth'}}):null;
const MEDIA=SB_URL+'/storage/v1/object/public/media/';
const E=(code,message)=>({code,message});
const CODES=/^(invalid_argument|permission_denied|already_exists|resource_exhausted|unauthenticated|unavailable|internal|timeout)$/;
function norm(e){if(!e)return E('unavailable','通信に失敗しました。もう一度お試しください');if(CODES.test(e.code||''))return e;
 const m=String(e.message||e.error_description||e.msg||e||''),c=String(e.code||'');
 if(c==='P0001'&&m==='もう一度ログインしてください')return E('unauthenticated',m);
 if(c==='P0001')return E(/多すぎ|短時間/.test(m)?'resource_exhausted':/許可|できません|凍結/.test(m)?'permission_denied':'invalid_argument',m);

 document.body.appendChild(m);

const RULES={
 login:v=>v?'':'メールアドレスかユーザーIDを入力してください',
 password:v=>!v?'パスワードを入力してください':A.mode==='login'?'':v.length<8?'8文字以上にしてください':(!/[A-Za-z]/.test(v)||!/[0-9]/.test(v))?'英字と数字を両方含めてください':'',
 name:v=>v?'':'表示名を入力してください',

 email:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?'':'メールアドレスの形式が正しくありません（例：name@example.com）',
 code:v=>/^\d{6,10}$/.test(v)?'':'メールに届いた数字のコードを入力してください'};
function validate(f){let first=null;f.querySelectorAll('input[name]').forEach(i=>{const r=RULES[i.name];if(!r)return;const m=r(i.name==='password'?i.value:i.value.trim());fErr(i.name,m);if(m&&!first)first=i});return first}
function friendly(x){const c=x&&x.code,m=(x&&x.message)||'';
 if(c==='timeout')return'サーバーから応答がありません。通信環境を確認して、もう一度お試しください';
 if(c==='resource_exhausted')return A.mode==='login'?'ログインの失敗が続いたため、一時的にロックしています。15分ほど待ってからお試しください':'操作が多すぎます。しばらく待ってからお試しください';
 if(c==='permission_denied')return m||'このアカウントは利用できません';
 if(c==='unavailable'||!m)return'通信に失敗しました。通信環境を確認して、もう一度お試しください';
 return m}
function setBusy(f,on){const btn=f.querySelector('[type=submit]');if(!btn)return;clearTimeout(A.slowT);const slow=$a('#aslow');
 if(on){btn.dataset.l=btn.textContent;btn.disabled=true;btn.setAttribute('aria-busy','true');btn.innerHTML='<span class="spin" aria-hidden="true"></span>'+BUSY[A.mode];f.querySelectorAll('input').forEach(i=>i.readOnly=true);A.slowT=setTimeout(()=>{if(slow)slow.hidden=false},6000)}
 else{if(!btn.isConnected)return;btn.disabled=false;btn.removeAttribute('aria-busy');btn.textContent=btn.dataset.l||'送信';f.querySelectorAll('input').forEach(i=>i.readOnly=false);if(slow)slow.hidden=true}}
document.addEventListener('click',async e=>{
 const eye=e.target.closest('.eye');if(eye){const i=eye.parentNode.querySelector('input');const show=i.type==='password';i.type=show?'text':'password';eye.setAttribute('aria-pressed',String(show));eye.setAttribute('aria-label',show?'パスワードを隠す':'パスワードを表示');eye.querySelector('use').setAttribute('href',show?'#i-eyeoff':'#i-eye');i.focus();try{const n=i.value.length;i.setSelectionRange(n,n)}catch(_){}return}
 const b=e.target.closest('#auth [data-am]');if(!b)return;const m=b.dataset.am;
 if(m==='resend2'){b.disabled=true;try{await run({op:'resend2fa',email:A.email});showAuth('2fa','確認コードを再送しました。メールを確認してください')}catch(x){aErr(friendly(x));b.disabled=false}return}
 if(m==='accback'){const a=K.accounts()[0];if(a)K.switchTo(a.uid);return}
 if(m==='guide'||m==='terms'||m==='privacy'){const g=document.querySelector(`[data-act=${m}]`);g&&g.click();return}
 if(m==='resend'){b.disabled=true;try{await run({op:'resend',email:A.email});showAuth('verify','確認メールを再送しました。メールを確認してください')}catch(x){aErr(friendly(x));b.disabled=false}return}
 showAuth(m)});
document.addEventListener('input',e=>{const i=e.target;if(i.closest&&i.closest('[id=af]')&&i.classList.contains('invalid'))fErr(i.name,'')});
const capsCheck=e=>{const i=e.target;if(!i||i.tagName!=='INPUT'||!i.closest('.pwf')||typeof e.getModifierState!=='function')return;const w=i.closest('.pwf');let c=w.nextElementSibling;if(!c||!c.classList.contains('caps')){c=document.createElement('p');c.className='caps';c.textContent='Caps Lock がオンになっています';w.after(c)}c.hidden=!e.getModifierState('CapsLock')};

new MutationObserver(enhancePw).observe(document.body,{childList:true,subtree:true});
document.addEventListener('submit',async e=>{const f=e.target;if(f.getAttribute('id')!=='af')return;e.preventDefault();e.stopImmediatePropagation();
 if(f.querySelector('[aria-busy]'))return;
 aErr('');const bad=validate(f);if(bad){aErr('入力内容を確認してください');bad.focus();return}
 const ag=f.querySelector('[name=agree]');if(ag&&!ag.checked){aErr('登録するには、利用規約・プライバシーポリシー・ガイドラインへの同意が必要です');ag.focus();return}
 const v=n=>{const i=f.querySelector(`[name=${n}]`);return i?i.value.trim():''},pw=()=>{const i=f.querySelector('[name=password]');return i?i.value:''};
 setBusy(f,true);
 try{let r;
  if(A.mode==='login')r=await run({op:'login',id:v('login'),password:pw()});
  if(A.mode==='2fa'){const t=f.querySelector('[name=trust]');r=await run({op:'verify2fa',email:A.email,code:v('code'),trust:!t||t.checked})}
  if(r&&r.need2fa){A.email=r.email;setBusy(f,false);showAuth('2fa');return}
  if(A.mode==='register')r=await run({op:'register',name:v('name'),handle:v('handle').replace(/^@/,''),email:v('email'),password:pw()});
  if(A.mode==='verify')r=await run({op:'verify',email:A.email,code:v('code')});
  if(A.mode==='reset'){await run({op:'resetReq',email:v('email')});A.email=v('email');showAuth('reset2','再設定用のメールを送りました（登録済みのアドレスの場合のみ届きます）');return}
  if(A.mode==='newpw')r=await run({op:'newPass',password:pw()});
  if(A.mode==='reset2'){await run({op:'resetDo',email:A.email,code:v('code'),password:pw()});showAuth('login','パスワードを再設定しました。新しいパスワードでログインしてください');return}
  if(r&&r.needVerify){A.email=r.email;showAuth('verify',A.mode==='login'?'メールアドレスの確認がまだ済んでいません。確認メールを送りました':'');return}
  if(r&&r.token){K.setToken(r.token);await K.start();$a('#auth').hidden=true;return}
  aErr('予期しない応答がありました。もう一度お試しください');
 }catch(x){const msg=friendly(x);setBusy(f,false);aErr(msg);
  if(A.mode==='login'&&x&&x.code==='invalid_argument'){fErr('login',' ');fErr('password',' ');const p=f.querySelector('[name=password]');if(p){p.value='';p.focus()}}
  else if(/ユーザーID/.test(msg))fErr('handle',msg);else if(/メールアドレス/.test(msg)&&f.querySelector('[name=email]'))fErr('email',msg);else if(/コード/.test(msg))fErr('code',msg);else if(/パスワード/.test(msg)&&A.mode!=='login')fErr('password',msg);
  return}
 setBusy(f,false)},true);
(async()=>{
 trace('起動 '+VER);
 if(!sb){K.cfg={url:site()};showAuth('login');aErr('config.js に Supabase の Project URL と anon key が入っていません（README の手順を確認してください）');return}

 if(recovering&&session){showAuth('newpw');return}

<script>
{
// ===== 基本 =====
window.__kodamaMain=true;

const S={badges:{},site:{signup:true,maintenance:false,ngwords:[],maint_msg:''},adminsList:[],db:null,user:null,assets:null,dl:null,me:null,admin:false,ro:false,loaded:false,
 posts:[],likes:[],reposts:[],follows:[],profiles:{},names:{},hidden:{},susp:{},blocks:{},ann:[],reports:[],rstat:{},modlog:[],privPosts:[],
 priv:{lists:[],showNsfw:false,bookmarks:[],mutes:[],muteWords:[],seen:0,history:[],drafts:[],notifOff:[],dismissed:[],dm:'all',dmAccepted:[],dmHidden:{},dmHideMsg:[]},views:{},stars:[],starViews:[],anim:null,dms:[],dmc:{text:'',file:null,url:''},votes:{},freqs:[],comms:[],members:[],reveal:new Set(),trx:{},ef:{from:'',to:'',type:'all',user:'',likes:0,replies:true},cq:'',sched:null,adminInfo:null,
 route:'home',arg:null,tab:{comm:'posts',list:'posts',messages:'inbox',home:'rec',profile:'posts',notifications:'all',explore:'posts',admin:'stats',bookmarks:'new'},
 q:'',esort:'new',limit:PAGE,menu:null,modal:null,who:null,edit:null,adm:{},lastPost:0,likeT:[],followT:[],homeSeen:0,pending:false,hc:null};
const hash32=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};

const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const av=(u,cls='')=>{const a=blob(prof(u).avatar);return`<span class="av ${cls}" style="background:${ucolor(u)}" aria-hidden="true">${a?`<img src="${esc(a)}" alt="">`:esc([...dname(u)][0]||'?')}</span>`};
const ulink=(u,inner,cls='')=>`<a href="#u-${hex(u)}" class="${cls}">${inner}</a>`;
const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],isEn=()=>KODAMA.lang==='en',LGX=()=>KODAMA.lang;
const agoX=(t,s)=>{const L=LGX(),d=new Date(t),ny=d.getFullYear()!==new Date().getFullYear();if(L==='ko'){if(s<60)return'방금';if(s<3600)return Math.floor(s/60)+'분';if(s<86400)return Math.floor(s/3600)+'시간';return(ny?d.getFullYear()+'년 ':'')+(d.getMonth()+1)+'월 '+d.getDate()+'일'}const tw=L==='zh-TW';if(s<60)return tw?'剛剛':'刚刚';if(s<3600)return Math.floor(s/60)+(tw?'分鐘':'分钟');if(s<86400)return Math.floor(s/3600)+(tw?'小時':'小时');return(ny?d.getFullYear()+'年':'')+(d.getMonth()+1)+'月'+d.getDate()+'日'};
const hmX=d=>d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
const ago=t=>{const s=(Date.now()-t)/1000;if(['ko','zh-CN','zh-TW'].includes(LGX()))return agoX(t,s);if(isEn()){if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';const d=new Date(t);return MONS[d.getMonth()]+' '+d.getDate()+(d.getFullYear()===new Date().getFullYear()?'':', '+d.getFullYear())}if(s<60)return'たった今';if(s<3600)return Math.floor(s/60)+'分';if(s<86400)return Math.floor(s/3600)+'時間';const d=new Date(t),n=new Date();return d.getFullYear()===n.getFullYear()?`${d.getMonth()+1}月${d.getDate()}日`:`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`};

function syncHomeC(){const r=S.route;let key=null;if(r==='home')key='h';else if(r==='comm'&&S.arg&&isMember(S.arg))key='c';const box=$('#homeC');const show=!!key&&!!S.me&&!S.ro;box.hidden=!show;if(!show)return;
 if(key==='c'&&(!S.cc||S.cc.comm!==S.arg)){S.cc=newC();S.cc.comm=S.arg;box.dataset.k=''}if(box.dataset.k!==key||!box.innerHTML)mountC(key)}
function lpCheck(key){const c=getC(key);if(!c)return;clearTimeout(c.lpT);c.lpT=setTimeout(()=>{const u=firstUrl(c.text);if(u===c.lpUrl)return;c.lpUrl=u;c.lp=null;const el=$(`[data-c="${key}"] .clp`);if(el)el.innerHTML='';if(!u)return;KODAMA.run({op:'preview',url:u}).then(v=>{if(c.lpUrl!==u||!v)return;c.lp=v;const e2=$(`[data-c="${key}"] .clp`);if(e2)e2.innerHTML=`<div class="lc small" data-ugc>${v.image?`<img src="${esc(v.image)}" alt="" referrerpolicy="no-referrer">`:''}<div class="lct"><span class="ls">${esc(v.site)}</span><b>${esc(v.title)}</b></div></div>`}).catch(()=>{})},700)}
function updC(key){const c=getC(key),el=$(`[data-c="${key}"]`);if(!c||!el)return;const n=[...c.text].length,left=MAX-n;
 const cnt=el.querySelector('.cnt');cnt.textContent=left<=40?left:'';cnt.classList.toggle('over',left<0);
 const ok=!c.busy&&left>=0&&(c.text.trim()||c.files.length||c.keep.length||c.mode==='quote'||c.poll)&&S.db&&S.me&&!S.ro&&!isSusp(S.me);
 el.querySelector('.send').disabled=!ok;const t=el.querySelector('.ctext');t.style.height='auto';t.style.height=Math.max(52,t.scrollHeight)+'px'}
function addFiles(c,list){if(c.poll){toast('投票と画像・動画は同時に使えません');return}for(const f of list){const type=f.type.startsWith('video/')?'video':f.type.startsWith('image/')?'image':null;
 if(!type){toast('画像か動画のファイルを選んでください');continue}if(f.size>20*1048576){toast('ファイルは1つ20MBまでです');continue}
 const all=[...c.files,...c.keep],hasV=all.some(x=>x.type==='video');
 if((type==='video'&&all.length)||hasV){toast('動画は1本だけ、画像と分けて投稿できます');continue}
 if(all.length>=4){toast('画像は4枚までです');break}
 c.files.push({file:f,url:URL.createObjectURL(f),alt:'',type})}}
async function compress(f){if(/gif|svg/.test(f.type))return f;try{const b=await createImageBitmap(f),k=Math.min(1,2048/Math.max(b.width,b.height)),cv=document.createElement('canvas');
 cv.width=Math.round(b.width*k);cv.height=Math.round(b.height*k);cv.getContext('2d').drawImage(b,0,0,cv.width,cv.height);
 const o=await new Promise(r=>cv.toBlob(r,'image/webp',.86));return o&&o.size<f.size?o:f}catch(e){return f}}
const privRef=id=>S.db.collection('data/users/'+S.me).doc('p_'+id);
async function submitC(key){const c=getC(key);if(!c||c.busy)return;const text=c.text.trim();
 if([...text].length>MAX)return;if(isSusp(S.me)){toast('アカウントが凍結中のため投稿できません');return}
 let poll=null;if(c.poll){const ops=c.poll.opts.map(x=>x.trim()).filter(Boolean);if(ops.length<2){toast('投票の選択肢を2つ以上入力してください');return}poll={opts:ops,dur:+c.poll.dur}}
 let schedAt=0;if(c.sched){schedAt=new Date(c.sched).getTime();if(!(schedAt>Date.now()+6e4)){toast('予約日時は1分以上先にしてください');return}}
 if(c.mode!=='edit'&&!c.sched){if(Date.now()-S.lastPost<8000){toast('連続投稿は少し時間をあけてください');return}
  const last=S.posts.find(p=>p.author===S.me&&!p.replyTo);if(text&&last&&last.text===text&&Date.now()-last.at<36e5){toast('同じ内容を続けて投稿することはできません');return}}
 c.busy=true;mountC(key);
 const ok=await write(async()=>{const media=c.keep.map(m=>({...m}));
  for(const f of c.files){if(!S.assets)throw{code:'noassets'};const r=await S.assets.upload(f.type==='image'?await compress(f.file):f.file);media.push({id:r.id,type:f.type,alt:f.alt.trim().slice(0,400)})}
  if(c.mode==='edit'){const p=D.byId[c.target];await(p.private?privRef(p.id):S.db.doc('posts/'+p.id)).update({text,media,editedAt:Date.now(),nsfw:!!c.nsfw})}
  else if(c.sched){await KODAMA.run({op:'schedule',at:schedAt,post:{text,media,poll,aud:c.vis==='followers'?'followers':'all',scope:c.scope||'all',nsfw:!!c.nsfw,comm:c.comm||'',quoteOf:c.mode==='quote'?c.target:''}});S.sched=null}
  else{const id=newId(),doc={author:S.me,text,at:Date.now(),replyTo:c.mode==='reply'?c.target:null,quoteOf:c.mode==='quote'?c.target:null,media,scope:c.scope||'all',aud:c.vis==='followers'?'followers':'all',poll,nsfw:!!c.nsfw,comm:c.comm||''};
   if(c.vis==='self')await privRef(id).set({...doc,private:true});else await S.db.doc('posts/'+id).set(doc);S.lastPost=Date.now();
   if(c.draftId){S.priv.drafts=S.priv.drafts.filter(d=>d.id!==c.draftId);savePriv()}}});
 c.busy=false;
 if(ok){toast(c.sched?'予約しました。設定画面の「予約中の投稿」で確認できます':{new:'投稿しました',reply:'返信しました',quote:'引用しました',edit:'編集しました'}[c.mode]);c.files.forEach(f=>URL.revokeObjectURL(f.url));
  if(key==='h'){S.hc=newC();try{localStorage.removeItem('kodama-draft')}catch(_){}mountC('h')}else if(key==='c'){const cid=S.cc.comm;S.cc=newC();S.cc.comm=cid;mountC('c')}else closeModal()}
 else mountC(key)}

async function write(fn){if(S.ro){toast('この操作はできません');return false}
 try{await fn();return true}catch(e){const c=e?.code;
  if(c==='noassets')toast('画像をアップロードできません');
  else if(c==='unauthenticated')KODAMA.expire(e.message);
  else toast(e?.message||'送信できませんでした。もう一度お試しください');return false}}
let privQ=Promise.resolve();
function savePriv(){if(!S.db||!S.me||!S.privLoaded){schedule();return}const snap=JSON.parse(JSON.stringify(S.priv));privQ=privQ.then(()=>S.db.doc(`data/users/${S.me}/state`).set(snap)).catch(()=>{});schedule()}
const modlog=(action,note='')=>S.db.collection('modlog').doc(newId()).set({by:S.me,action,note,at:Date.now()}).catch(()=>{});
function rate(arr,n,ms,msg){const now=Date.now();while(arr.length&&now-arr[0]>ms)arr.shift();if(arr.length>=n){toast(msg);return false}arr.push(now);return true}
async function toggleLike(id){if(!S.me)return;const on=(D.lk[id]||[]).some(l=>l.user===S.me);if(!on&&!rate(S.likeT,40,6e4,'いいねの操作が多すぎます。少し待ってください'))return;
 const ref=S.db.doc(`likes/${id}__${S.me}`);anim('like:'+id);await write(()=>on?ref.delete():ref.set({post:id,user:S.me,at:Date.now()}))}
async function toggleRepost(id){const on=(D.rp[id]||[]).some(r=>r.user===S.me);const ref=S.db.doc(`reposts/${id}__${S.me}`);anim('rp:'+id);if(await write(()=>on?ref.delete():ref.set({post:id,user:S.me,at:Date.now()})))toast(on?'リポストを取り消しました':'リポストしました')}
async function toggleFollow(u){const on=following(S.me).has(u);if(!on&&blocksMe(u))return;if(!on&&!rate(S.followT,30,6e5,'短時間に多くのユーザーをフォローすることはできません'))return;
 const ref=S.db.doc(`follows/${S.me}__${u}`);await write(()=>on?ref.delete():ref.set({from:S.me,to:u,at:Date.now()}))}
async function setBlock(u,on){const list=new Set(S.blocks[S.me]||[]);on?list.add(u):list.delete(u);
 if(await write(async()=>{await S.db.doc('blocks/'+S.me).set({list:[...list]});if(on){await S.db.doc(`follows/${S.me}__${u}`).delete();await S.db.doc(`follows/${u}__${S.me}`).delete()}}))toast(on?'ブロックしました':'ブロックを解除しました')}
function toggleMute(u){const m=new Set(S.priv.mutes);const on=!m.has(u);on?m.add(u):m.delete(u);S.priv.mutes=[...m];savePriv();toast(on?'ミュートしました':'ミュートを解除しました')}
async function delPost(p){await write(async()=>{if(p.private){await privRef(p.id).delete();return}
 await S.db.doc('posts/'+p.id).delete();for(const l of D.lk[p.id]||[])if(l.user===S.me)await S.db.doc(`likes/${p.id}__${S.me}`).delete();
 if(prof(S.me).pinned===p.id)await S.db.doc('profiles/'+S.me).update({pinned:null});
 if(S.assets)for(const m of p.media||[])await S.assets.delete(m.id).catch(()=>{})})&&toast('削除しました')}
async function sendReport(kind,target,reason,detail,who){const ref=S.db.doc('reports/'+S.me);let items=[];
 if(await write(async()=>{const d=await ref.get();items=(d.exists&&Array.isArray(d.data().items)?d.data().items:[]).slice(-199);items.push({id:newId(),kind,target,who:who||'',reason,detail:detail.slice(0,500),at:Date.now()});await ref.set({items})}))toast('通報を受け付けました。ご協力ありがとうございます')}
async function exportData(){const me=S.me,data={exportedAt:new Date().toISOString(),profile:prof(me),posts:S.posts.filter(p=>p.author===me),privatePosts:S.privPosts,likes:S.likes.filter(l=>l.user===me),reposts:S.reposts.filter(r=>r.user===me),following:[...following(me)],followers:[...followers(me)],blocks:S.blocks[me]||[],settings:S.priv};
 const json=JSON.stringify(data,null,2);
 if(S.dl){try{await S.dl.save({filename:'orbit-export.json',data:json});return}catch(e){try{await S.dl.save({filename:'orbit-export.json',data:new Blob([json],{type:'application/json'})});return}catch(_){}}}
 try{await navigator.clipboard.writeText(json);toast('データをクリップボードにコピーしました')}catch(e){toast('書き出しできませんでした')}}

 return`<div class="stars" role="list" aria-label="流れ星">${me}${others.map(x=>`<button class="sitem${starSeen(x.id)?' seen':''}" role="listitem" data-act="starv" data-u="${esc(x.author)}" aria-label="${esc(dname(x.author))}"><span class="sav">${starRing(x,starSeen(x.id))}${av(x.author,'s')}</span><span class="snm" data-ugc>${esc(dname(x.author))}</span></button>`).join('')}${others.length?'':`<div class="shint">フォローしている人の流れ星がここに流れます。<br>24時間で消える「いま」のひとことです。</div>`}</div>`}
function renderStars(){const b=$('#starsC');if(!b)return;const show=S.route==='home'&&!!S.me&&S.loaded&&!S.ro;b.hidden=!show;if(!show)return;const h=starsBand();if(b.__h!==h){b.innerHTML=h;b.__h=h}}

 if(!o.__sb){o.__sb=1;

// ===== 画像の切り抜き =====
async function loadPic(file){
 // 写真を読み込み、長い辺を2048pxまでに縮めたJPEGにする（iPhoneのHEIC・大きな写真・向きの補正にも対応）
 const fromBitmap=async()=>{const bm=await createImageBitmap(file);return{src:bm,w:bm.width,h:bm.height}};
 const fromImg=()=>new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res({src:im,w:im.naturalWidth,h:im.naturalHeight,u});im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};im.src=u});
 let d;try{d=await fromImg()}catch(e){d=await fromBitmap()}
 const k=Math.min(1,2048/Math.max(d.w,d.h)),W=Math.max(1,Math.round(d.w*k)),H=Math.max(1,Math.round(d.h*k));
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(d.src,0,0,W,H);
 if(d.u)URL.revokeObjectURL(d.u);if(d.src.close)d.src.close();
 const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));if(!blob)throw new Error('encode');
 const url=URL.createObjectURL(blob);const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});return{url,img,w:W,h:H,blob}}
async function openCrop(field,file){if(!S.assets){toast('画像をアップロードする権限がありません');return}
 toast('画像を読み込んでいます…');
 try{const p=await loadPic(file);S.crop={field,url:p.url,img:p.img,file,w:p.w,h:p.h,z:1,x:0,y:0,s:1,ptrs:new Map()};openModal({kind:'crop'});const o=$('#ovl');if(o)o.scrollTop=0}
 catch(e){toast('この画像は読み込めませんでした。JPEGかPNGの画像を選んでください')}}
function cropLayout(){const c=S.crop,box=$('#cbox');if(!c||!box)return;c.BW=box.clientWidth;c.BH=box.clientHeight;c.s0=Math.max(c.BW/c.w,c.BH/c.h);c.s=c.s0*c.z;
 c.x=(c.BW-c.w*c.s)/2;c.y=(c.BH-c.h*c.s)/2;cropDraw();bindCrop(box)}
function cropClamp(){const c=S.crop,dw=c.w*c.s,dh=c.h*c.s;c.x=Math.min(0,Math.max(c.BW-dw,c.x));c.y=Math.min(0,Math.max(c.BH-dh,c.y))}
function cropDraw(){const c=S.crop,im=$('#cimg');if(!c||!im)return;cropClamp();im.style.width=c.w*c.s+'px';im.style.height=c.h*c.s+'px';im.style.transform=`translate(${c.x}px,${c.y}px)`;const z=$('#cz');if(z&&document.activeElement!==z)z.value=c.z}
function cropZoom(z,cx,cy){const c=S.crop;if(!c)return;z=Math.min(5,Math.max(1,z));cx??=c.BW/2;cy??=c.BH/2;const px=(cx-c.x)/c.s,py=(cy-c.y)/c.s;c.z=z;c.s=c.s0*z;c.x=cx-px*c.s;c.y=cy-py*c.s;cropDraw()}
function cropMove(dx,dy){const c=S.crop;c.x+=dx;c.y+=dy;cropDraw()}
function bindCrop(box){if(box.dataset.b)return;box.dataset.b='1';const c=S.crop;
 box.addEventListener('pointerdown',e=>{box.setPointerCapture(e.pointerId);c.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY})});
 box.addEventListener('pointermove',e=>{const pr=c.ptrs.get(e.pointerId);if(!pr)return;const r=box.getBoundingClientRect();
  if(c.ptrs.size===1){cropMove(e.clientX-pr.x,e.clientY-pr.y)}
  else if(c.ptrs.size===2){const ps=[...c.ptrs.values()],o=ps.find(q=>q!==pr),d0=Math.hypot(pr.x-o.x,pr.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);if(d0>0)cropZoom(c.z*d1/d0,(e.clientX+o.x)/2-r.left,(e.clientY+o.y)/2-r.top)}
  pr.x=e.clientX;pr.y=e.clientY});
 const up=e=>c.ptrs.delete(e.pointerId);box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
 box.addEventListener('wheel',e=>{e.preventDefault();const r=box.getBoundingClientRect();cropZoom(c.z*Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
 $('#cz').addEventListener('input',e=>cropZoom(+e.target.value))}
async function cropApply(b){const c=S.crop;if(!c)return;const W=c.field==='avatar'?400:1500,H=c.field==='avatar'?400:500;

 g.drawImage(c.img,-c.x/c.s,-c.y/c.s,c.BW/c.s,c.BH/c.s,0,0,W,H);

  const r=await S.assets.upload(blob);if(S.edit)S.edit[c.field]=r.id;await S.db.doc('profiles/'+S.me).update({[c.field]:r.id});URL.revokeObjectURL(c.url);S.crop=null;closeModal();renderView();renderSide();toast(c.field==='avatar'?'アイコンを変更しました':'ヘッダー画像を変更しました')}

  sub(db.doc(`data/users/${S.me}/state`),d=>{if(d.metadata.hasPendingWrites)return;const x=d.exists?d.data():{};const arr=k=>Array.isArray(x[k])?x[k]:[];
   S.priv={bookmarks:arr('bookmarks').map(String),mutes:arr('mutes').map(String),muteWords:arr('muteWords').map(String),seen:num(x.seen),history:arr('history').map(String).slice(0,10),drafts:arr('drafts').filter(d=>d&&typeof d.text==='string').map(d=>({id:str(d.id),text:d.text,at:num(d.at)})),notifOff:arr('notifOff').map(String),dismissed:arr('dismissed').map(String),dm:['all','following','none'].includes(x.dm)?x.dm:'all',lang:['ja','en','ko','zh-CN','zh-TW'].includes(x.lang)?x.lang:'',status:['auto','busy','offline'].includes(x.status)?x.status:'auto',showNsfw:x.showNsfw===true,lists:arr('lists').filter(l=>l&&typeof l.name==='string').slice(0,50).map(l=>({id:str(l.id),name:str(l.name).slice(0,40),members:Array.isArray(l.members)?l.members.map(String).slice(0,500):[]})),dmAccepted:arr('dmAccepted').map(String),dmHideMsg:arr('dmHideMsg').map(String).slice(-2000),dmHidden:x.dmHidden&&typeof x.dmHidden==='object'&&!Array.isArray(x.dmHidden)?Object.fromEntries(Object.entries(x.dmHidden).map(([k,v])=>[k,num(v)])):{}};
   KODAMA.status=S.priv.status;
   if(!S.privLoaded){S.privLoaded=true;KODAMA.refresh();if(S.priv.lang&&S.priv.lang!==KODAMA.lang)KODAMA.setLang(S.priv.lang);if(S.route==='notifications'){S.seenAtOpen=S.priv.seen;S.priv.seen=Date.now();savePriv()}}});
  sub(db.collection('dms'),s=>{S.dms=s.docs.map(d=>{const x=d.data()||{};return{id:d.id,conv:str(x.conv),from:str(x.from),to:str(x.to),text:str(x.text).slice(0,2000),at:num(x.at),readAt:num(x.readAt),media:Array.isArray(x.media)?x.media.slice(0,1).map(m=>({id:str(m?.id),type:m?.type==='video'?'video':'image',alt:str(m?.alt)})).filter(m=>m.id):[],replyTo:str(x.replyTo),editedAt:num(x.editedAt),reacts:x.reacts&&typeof x.reacts==='object'&&!Array.isArray(x.reacts)?Object.fromEntries(Object.entries(x.reacts).filter(([e,l])=>REACTS.includes(e)&&Array.isArray(l)).map(([e,l])=>[e,l.map(String)])):{}}}).filter(m=>m.conv)});
  sub(db.collection('data/users/'+S.me).limit(500),s=>{S.privPosts=s.docs.filter(d=>d.id.startsWith('p_')).map(d=>normPost(d,true))});
 }
 if(S.admin){
  sub(db.collection('reports').limit(1000),s=>{S.reports=s.docs.flatMap(d=>{const it=d.data()?.items;return Array.isArray(it)?it.map(r=>({id:str(r.id),kind:['user','dm'].includes(r.kind)?r.kind:'post',target:str(r.target),who:str(r.who),snap:str(r.snap),reason:str(r.reason),detail:str(r.detail),at:num(r.at),by:d.id})).filter(r=>r.id):[]})});
  sub(db.collection('reportStatus').limit(1000),s=>{S.rstat=Object.fromEntries(s.docs.map(d=>{const x=d.data()||{};return[d.id,{status:['open','doing','done'].includes(x.status)?x.status:'open',by:str(x.by),result:str(x.result)}]}))});
  sub(db.collection('modlog').orderBy('at','desc').limit(300),s=>{S.modlog=s.docs.map(d=>{const x=d.data()||{};return{by:str(x.by),action:str(x.action),note:str(x.note),at:num(x.at)}})});
 }
 mountC('h');resolveNames();go();
})();
